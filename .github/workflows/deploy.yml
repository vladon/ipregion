name: Deploy static site

on:
  push:
    branches:
      - master
    paths:
      - ipregion.sh
      - index.html
      - tests/run.sh
      - tests/golden.sh
      - tests/golden/**
      - .github/workflows/deploy.yml
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  group: deploy-ipregion-top
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        bash_image: ["bash:4.4", "bash:5.2"]
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Run unit tests (${{ matrix.bash_image }})
        run: |
          docker run --rm \
            -v "$PWD":/work \
            -w /work \
            "${{ matrix.bash_image }}" \
            sh -lc 'apk add --no-cache jq >/dev/null && bash tests/run.sh && bash tests/golden.sh'

  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install lint tools
        run: sudo apt-get update && sudo apt-get install -y shellcheck shfmt

      - name: Run shellcheck
        run: shellcheck -S error ipregion.sh tests/run.sh tests/golden.sh

      - name: Check formatting
        run: shfmt -i 2 -d ipregion.sh tests/run.sh tests/golden.sh

  deploy:
    runs-on: ubuntu-latest
    needs: [quality, lint]
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y jq rsync

      - name: Extract version metadata
        id: version
        run: |
          if [[ "${{ github.event_name }}" == "release" ]]; then
            VERSION_TYPE="tag"
            VERSION_VALUE="${{ github.event.release.tag_name }}"
            COMMIT_HASH="${GITHUB_SHA:0:8}"
          else
            VERSION_TYPE="commit"
            VERSION_VALUE="${GITHUB_SHA:0:8}"
            COMMIT_HASH=""
          fi

          BUILD_DATE=$(git log -1 --format=%cI HEAD)
          VERSION_METADATA="${VERSION_TYPE}|${VERSION_VALUE}|${BUILD_DATE}|${COMMIT_HASH}"

          echo "version_type=${VERSION_TYPE}" >> "$GITHUB_OUTPUT"
          echo "version_value=${VERSION_VALUE}" >> "$GITHUB_OUTPUT"
          echo "build_date=${BUILD_DATE}" >> "$GITHUB_OUTPUT"
          echo "commit_hash=${COMMIT_HASH}" >> "$GITHUB_OUTPUT"
          echo "version_metadata=${VERSION_METADATA}" >> "$GITHUB_OUTPUT"
          echo "Version metadata: ${VERSION_METADATA}"

      - name: Inject version into script
        run: |
          sed -i "s#^SCRIPT_VERSION_METADATA=.*#SCRIPT_VERSION_METADATA=\"${{ steps.version.outputs.version_metadata }}\"#" ipregion.sh
          grep "^SCRIPT_VERSION_METADATA=" ipregion.sh

      - name: Configure SSH
        run: |
          set -eu
          install -m 700 -d ~/.ssh
          printf '%s\n' "${{ secrets.HH01_DEPLOY_KEY }}" > ~/.ssh/orange_deploy_key
          chmod 600 ~/.ssh/orange_deploy_key
          cat > ~/.ssh/config <<'EOF'
          Host ru00-jump
            HostName ru00.vladon.ooo
            User deploy
            IdentityFile ~/.ssh/orange_deploy_key
            IdentitiesOnly yes
            StrictHostKeyChecking accept-new

          Host orange-ipregion
            HostName orange.0xd.net
            User deploy
            IdentityFile ~/.ssh/orange_deploy_key
            IdentitiesOnly yes
            ProxyJump ru00-jump
            StrictHostKeyChecking accept-new
          EOF

      - name: Deploy files
        run: |
          install -d deploy-stage
          cp ipregion.sh index.html README.md LICENSE deploy-stage/
          rsync -az --delete \
            deploy-stage/ \
            orange-ipregion:/srv/www/ipregion.top/
